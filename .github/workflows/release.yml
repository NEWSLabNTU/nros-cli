name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    # Skip for `nros-v*` tags — those are the Rust binary releases
    # (release-binary.yml), not the Python wheel (Phase 195.A).
    if: ${{ !startsWith(github.event.release.tag_name, 'nros-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Build release distributions
        run: |
          cd colcon-cargo-ros2
          pipx run build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: colcon-cargo-ros2/dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build

    permissions:
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    environment:
      name: release
      url: https://pypi.org/p/colcon-cargo-ros2

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
