[package]
name = "cargo-nros"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "cargo subcommand front-end for the nros CLI: `cargo nros <verb>` shells `nros <verb>`."
homepage.workspace = true
documentation.workspace = true
keywords = ["ros2", "cli", "cargo-subcommand", "embedded"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[[bin]]
name = "cargo-nros"
path = "src/main.rs"

[features]
default = []
release = ["nros-cli-core/release"]

[dependencies]
clap = { workspace = true }
eyre = "0.6"
nros-cli-core = { path = "../nros-cli-core" }
